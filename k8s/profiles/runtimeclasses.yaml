# RuntimeClasses for R2 (gVisor) and R3 (Kata). Handler names are cluster-specific;
# overlays patch them (GKE: gvisor; k3s+gVisor: runsc; Kata: kata-qemu / kata-qemu-nvidia-gpu).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: { name: gvisor }
handler: runsc
scheduling:
  nodeSelector: { vice.cyverse.org/runtime-gvisor: "true" }
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: { name: kata }
handler: kata-qemu
scheduling:
  nodeSelector: { vice.cyverse.org/runtime-kata: "true" }
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: { name: kata-gpu }
handler: kata-qemu-nvidia-gpu
scheduling:
  nodeSelector: { vice.cyverse.org/runtime-kata-gpu: "true" }
