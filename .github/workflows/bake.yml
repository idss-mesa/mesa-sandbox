# Native multi-arch build of the image family (ADR-0013). Each platform builds
# on its own runner and pushes by digest; a merge job publishes the manifest
# lists. PRs build (no push) on both platforms.
name: bake
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]   # weekly rebuild on fresh bases (Monday 06:00 UTC)
  workflow_dispatch:
    inputs:
      targets: { description: "bake targets (space-separated)", default: "tools cli agent-runner", required: false }
permissions: { contents: read, id-token: write, security-events: write }
env:
  REGISTRY: harbor.cyverse.org/vice
  TARGETS: ${{ github.event.inputs.targets || 'tools cli agent-runner' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m venv .venv && .venv/bin/pip install -q pyyaml && .venv/bin/python scripts/resources.py check
      - uses: hadolint/hadolint-action@v3.1.0
        with: { recursive: true, failure-threshold: warning, no-fail: true }
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: harbor.cyverse.org, username: "${{ secrets.HARBOR_USERNAME }}", password: "${{ secrets.HARBOR_PASSWORD }}" }
      - name: Bake (smoke test stage)
        run: docker buildx bake -f resources.hcl -f docker-bake.hcl --set "*.platform=${{ matrix.platform }}" tools-test
        env: { PLATFORMS: "${{ matrix.platform }}" }
      - name: Bake and push by digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          docker buildx bake -f resources.hcl -f docker-bake.hcl --metadata-file /tmp/meta.json $TARGETS
          python3 - <<'PY'
          import json; m=json.load(open('/tmp/meta.json'))
          for t,v in m.items():
              d=v.get('containerimage.digest'); n=v.get('image.name','').split(',')[0].split(':')[0]
              if d and n: open(f"/tmp/digests/{t}.${{ matrix.arch }}", "w").write(f"{n}@{d}\n")
          PY
        env:
          PLATFORMS: ${{ matrix.platform }}
          PUSH_BY_DIGEST: "true"
          ATTEST: "true"
          GIT_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp && 0 || 0 }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: { name: "digests-${{ matrix.arch }}", path: /tmp/digests/*, if-no-files-found: ignore }
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: harbor.cyverse.org, username: "${{ secrets.HARBOR_USERNAME }}", password: "${{ secrets.HARBOR_PASSWORD }}" }
      - uses: actions/download-artifact@v4
        with: { path: /tmp/digests, pattern: "digests-*", merge-multiple: true }
      - name: Create manifest lists (latest, sha, date)
        run: |
          date=$(date -u +%Y-%m-%d); sha=${GITHUB_SHA::12}
          for t in $TARGETS; do
            refs=$(cat /tmp/digests/$t.* 2>/dev/null | tr '\n' ' '); [ -n "$refs" ] || continue
            name=$(cut -d@ -f1 /tmp/digests/$t.* | head -1)
            docker buildx imagetools create -t "$name:latest" -t "$name:$sha" -t "$name:$date" $refs
            docker buildx imagetools inspect "$name:latest"
          done
      - name: Sign manifest lists (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          for t in $TARGETS; do name=$(cut -d@ -f1 /tmp/digests/$t.* 2>/dev/null | head -1); [ -n "$name" ] || continue
            digest=$(docker buildx imagetools inspect "$name:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "$name@$digest"; done
